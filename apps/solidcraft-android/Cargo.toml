[package]
name = "solidcraft-android"
description = "SolidCraft on Android (eframe on a NativeActivity, wgpu on Vulkan or GLES)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace lints, except unsafe_code: denied, not forbidden, so that `android_main` can carry
# the `no_mangle` the activity glue finds it by. Keep the rest in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

# Loaded by the activity as libsolidcraft_android.so (android/app/src/main/AndroidManifest.xml).
[lib]
crate-type = ["cdylib", "rlib"]

# The MCP server on the network (src/mcp_http.rs), built and tested on every system.
[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
getrandom = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
solidcraft-ui-egui = { workspace = true }
# accesskit needs android-game-activity; NativeActivity is the one with no Java to ship.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
# The AndroidApp handed to android_main; the same winit eframe runs on.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# The document pickers (SolidCraftActivity) through JNI; the version the activity glue uses.
jni = "0.22"
# log → logcat (MIT OR Apache-2.0).
android_logger = { version = "0.15", default-features = false }
